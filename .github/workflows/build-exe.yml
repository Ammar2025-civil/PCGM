name: Build Windows exe

on:
  push:
    branches: [claude/gifted-bohr-d0e8fw]
    paths:
      - 'void_vanguard/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pygame-ce and PyInstaller
        run: python -m pip install --upgrade pip pygame-ce pyinstaller

      - name: Build VoidVanguard.exe
        working-directory: void_vanguard
        run: python -m PyInstaller --noconfirm --onefile --windowed --name VoidVanguard main.py

      - name: Smoke test (the exe starts and keeps running)
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          VV_SAVE_PATH: ${{ runner.temp }}\savegame.json
        run: |
          $p = Start-Process -FilePath "void_vanguard\dist\VoidVanguard.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "VoidVanguard.exe exited early with code $($p.ExitCode)"
            exit 1
          }
          taskkill /F /T /PID $p.Id | Out-Null
          Write-Host "VoidVanguard.exe started and ran for 15 seconds"

      - uses: actions/upload-artifact@v4
        with:
          name: VoidVanguard-windows
          path: void_vanguard/dist/VoidVanguard.exe

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: void-vanguard-build-${{ github.run_number }}
          name: Void Vanguard (Windows) build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **VoidVanguard.exe** below and double-click it. No Python needed.

            If Windows shows "Windows protected your PC", click **More info**, then **Run anyway**
            (the file is not code-signed). Progress saves to `savegame.json` next to the exe.
          files: void_vanguard/dist/VoidVanguard.exe
